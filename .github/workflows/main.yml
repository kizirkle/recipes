name: Run Script with API Key

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        working-directory: ./src
        run: npm run deploy

      - name: Run script using secret
        env:
          # Maps your GitHub Secret to a standard environment variable
          VITE_RECIPE_KEY: ${{ secrets.VITE_RECIPE_KEY }}
        run: |
          # Your script can now read $API_KEY from the environment
